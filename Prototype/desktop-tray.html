<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>系统托盘菜单 · 任务提醒</title>
<link rel="stylesheet" href="css/app.css" />
<style>
  :root { --taskbar: color-mix(in oklab, var(--fg), transparent 6%); }
  body { margin: 0; }
  .scene {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(1200px 600px at 70% 20%, color-mix(in oklab, var(--accent), transparent 86%), transparent),
      linear-gradient(160deg, color-mix(in oklab, var(--fg), transparent 28%), color-mix(in oklab, var(--fg), transparent 4%));
  }
  /* 桌面上几个淡淡的图标，营造真实感 */
  .desk-hint { position: absolute; top: 28px; left: 28px; display: grid; gap: 22px; }
  .desk-hint .di { width: 54px; text-align: center; color: rgba(255,255,255,.85); font-size: 11px; }
  .desk-hint .di .b { width: 44px; height: 44px; margin: 0 auto 6px; border-radius: 11px; background: rgba(255,255,255,.16); backdrop-filter: blur(4px); }

  /* 任务栏 */
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: color-mix(in oklab, var(--taskbar), transparent 8%);
    backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .tb-icon { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: rgba(255,255,255,.78); }
  .tb-icon svg { width: 19px; height: 19px; }
  .tb-icon:hover { background: rgba(255,255,255,.12); }
  .tray-cluster { position: absolute; right: 16px; bottom: 0; height: 48px; display: flex; align-items: center; gap: 14px; padding-inline: 16px; }
  .tray-cluster .ti { color: rgba(255,255,255,.85); position: relative; }
  .tray-cluster .ti svg { width: 17px; height: 17px; }
  .tray-cluster .clock { color: rgba(255,255,255,.92); text-align: right; font-size: 12px; line-height: 1.35; }
  /* 高亮托盘图标（被右键的那个） */
  .ti.app { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .ti.app svg { width: 16px; height: 16px; }
  .badge-flash { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--taskbar); animation: flash 1.1s steps(1) infinite; }
  @keyframes flash { 50% { opacity: .25; } }

  /* 上下文菜单 */
  .ctx-menu {
    position: absolute; right: 18px; bottom: 60px; width: 252px;
    background: color-mix(in oklab, var(--surface), transparent 2%);
    backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: 0 16px 48px color-mix(in oklab, var(--fg), transparent 64%);
    padding: 6px; animation: pop .16s var(--ease);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .ctx-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 12px; border-bottom: 1px solid var(--border-soft); margin-bottom: 6px; }
  .ctx-head .mk { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
  .ctx-head .mk svg { width: 16px; height: 16px; }
  .ctx-head b { font-size: var(--text-sm); display: block; }
  .ctx-head small { font-size: 11px; color: var(--muted); }
  .ctx-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 10px; border-radius: var(--radius-sm); border: none; background: transparent;
    color: var(--fg); font-size: var(--text-sm); text-align: left;
  }
  .ctx-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .ctx-item:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
  .ctx-item:hover svg { color: var(--accent); }
  .ctx-item .meta-r { margin-left: auto; font-size: 11px; color: var(--meta); font-family: var(--font-mono); }
  .ctx-item.danger:hover { background: var(--danger-soft); color: var(--danger); }
  .ctx-item.danger:hover svg { color: var(--danger); }
  .ctx-sep { height: 1px; background: var(--border-soft); margin: 6px 4px; }
  .ctx-status { display:flex; align-items:center; gap:8px; padding: 7px 10px; font-size: 11px; color: var(--muted); }

  .caption { position: absolute; left: 28px; bottom: 64px; color: rgba(255,255,255,.9); font-size: 12px; background: rgba(0,0,0,.32); padding: 7px 12px; border-radius: 8px; backdrop-filter: blur(8px); }
</style>
</head>
<body>
<div class="scene" data-od-id="tray-scene">

  <div class="desk-hint">
    <div class="di"><div class="b"></div>此电脑</div>
    <div class="di"><div class="b"></div>回收站</div>
  </div>

  <div class="caption">右键托盘图标 · 弹出菜单（已最小化到托盘，后台持续计时）</div>

  <!-- 任务栏 -->
  <div class="taskbar">
    <div class="tb-icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></div>
    <div class="tb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
    <div class="tb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/></svg></div>
    <div class="tb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H4z"/><path d="M2 20h20"/></svg></div>

    <div class="tray-cluster">
      <span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14 0M8.5 16a6 6 0 0 1 7 0M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></span>
      <span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 13a11 11 0 0 1-22 0 11 11 0 0 1 22 0z" fill="none"/><path d="M16 8a6 6 0 0 0-8 0M12 2v2"/></svg></span>
      <span class="ti app" title="任务提醒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
        <span class="badge-flash"></span>
      </span>
      <div class="clock"><div>13:47</div><div>2026/6/8</div></div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="ctx-menu" data-od-id="ctx-menu">
    <div class="ctx-head">
      <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg></div>
      <div><b>任务提醒</b><small>5 个启用 · 下次 14:00 喝水</small></div>
    </div>

    <a class="ctx-item" href="desktop-tasks.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      打开主界面
    </a>
    <button class="ctx-item" id="pauseItem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      <span id="pauseLabel">暂停所有提醒</span>
      <span class="meta-r" id="pauseState">运行中</span>
    </button>
    <a class="ctx-item" href="desktop-edit.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      快速新建任务
    </a>

    <div class="ctx-sep"></div>

    <a class="ctx-item" href="desktop-settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      全局设置
    </a>
    <button class="ctx-item danger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      退出应用
    </button>

    <div class="ctx-sep"></div>
    <div class="ctx-status"><span class="dot live"></span>调度运行中 · 内存 68 MB</div>
  </div>

</div>

<script>
  const item = document.getElementById('pauseItem');
  const label = document.getElementById('pauseLabel');
  const state = document.getElementById('pauseState');
  const flash = document.querySelector('.badge-flash');
  let paused = false;
  item.addEventListener('click', () => {
    paused = !paused;
    label.textContent = paused ? '恢复所有提醒' : '暂停所有提醒';
    state.textContent = paused ? '已暂停' : '运行中';
    if (flash) flash.style.display = paused ? 'none' : '';
    document.querySelectorAll('.side-status .dot, .dot.live').forEach(d => {
      d.classList.toggle('paused', paused); d.classList.toggle('live', !paused);
    });
  });
</script>
</body>
</html>
