<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设置（移动端）· 任务提醒</title>
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="phone-stage">
<div class="phone" data-od-id="phone">
  <div class="dynamic-island"></div>
  <div class="phone-screen">

    <div class="statusbar">
      <span class="sb-time">14:00</span>
      <span class="sb-right">
        <svg viewBox="0 0 24 14" fill="currentColor"><rect x="0" y="6" width="3" height="8" rx="1"/><rect x="5" y="4" width="3" height="10" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/></svg>
        <svg viewBox="0 0 24 14" fill="currentColor"><path d="M12 3C8 3 5 5 3 7l9 7 9-7c-2-2-5-4-9-4z" opacity=".9"/></svg>
        <svg viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="2" width="20" height="10" rx="3"/><rect x="3" y="4" width="15" height="6" rx="1.5" fill="currentColor"/><path d="M23 5v4" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
    </div>

    <header class="m-header">
      <div class="row1">
        <div><h1>设置</h1><div class="sub">默认值应用到所有未单独配置的任务</div></div>
        <a class="m-iconbtn" href="mobile-tasks.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
      </div>
    </header>

    <div class="m-scroll" style="padding-inline:0">

      <div class="m-group">
        <div class="g-title">遮罩默认配置</div>
        <div class="g-card">
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
            <div class="r-main"><b>默认倒计时</b><span>遮罩自动关闭的秒数</span></div>
            <span class="r-val">30s</span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <div class="r-main"><b>默认自动关闭</b><span>倒计时结束后收起</span></div>
            <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
          </div>
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg></div>
            <div class="r-main"><b>默认背景壁纸</b><span>半透明深色</span></div>
            <span class="r-val" style="font-family:var(--font-body)">默认</span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
        </div>
      </div>

      <div class="m-group">
        <div class="g-title">通用</div>
        <div class="g-card">
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
            <div class="r-main"><b>提醒音效</b><span>清脆叮咚</span></div>
            <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
          </div>
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
            <div class="r-main"><b>震动提醒</b><span>触发时震动</span></div>
            <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
          </div>
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div class="r-main"><b>后台保活</b><span>锁屏后继续定时提醒</span></div>
            <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
          </div>
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>
            <div class="r-main"><b>勿扰时段</b><span>23:00 – 07:00 静音</span></div>
            <label class="switch"><input type="checkbox" /><span class="track"></span></label>
          </div>
        </div>
      </div>

      <div class="m-group">
        <div class="g-title">数据</div>
        <div class="g-card">
          <div class="m-row">
            <div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
            <div class="r-main"><b>导出任务</b><span>备份到本地文件</span></div>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
          <div class="m-row">
            <div class="r-ico" style="color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
            <div class="r-main"><b style="color:var(--danger)">清空所有任务</b><span>删除后无法恢复</span></div>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>
        </div>
      </div>

      <p style="text-align:center;color:var(--meta);font-size:12px;margin:4px 0 20px">任务提醒 · v1.0.0</p>
    </div>

    <nav class="m-tabbar">
      <button class="m-tab" onclick="location.href='mobile-tasks.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>任务</button>
      <button class="m-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>日程</button>
      <button class="m-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>统计</button>
      <button class="m-tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>
    </nav>

    <div class="home-ind"></div>
  </div>
</div>
</body>
</html>
