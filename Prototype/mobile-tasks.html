<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>任务列表（移动端）· 任务提醒</title>
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="phone-stage">
<div class="phone" data-od-id="phone">
  <div class="dynamic-island"></div>
  <div class="phone-screen">

    <div class="statusbar">
      <span class="sb-time">14:00</span>
      <span class="sb-right">
        <svg viewBox="0 0 24 14" fill="currentColor"><rect x="0" y="6" width="3" height="8" rx="1"/><rect x="5" y="4" width="3" height="10" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/></svg>
        <svg viewBox="0 0 24 14" fill="currentColor"><path d="M12 3C8 3 5 5 3 7l9 7 9-7c-2-2-5-4-9-4z" opacity=".9"/></svg>
        <svg viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="2" width="20" height="10" rx="3"/><rect x="3" y="4" width="15" height="6" rx="1.5" fill="currentColor"/><path d="M23 5v4" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
    </div>

    <header class="m-header">
      <div class="row1">
        <div>
          <h1>任务提醒</h1>
          <div class="sub">5 个启用 · 下次 14:00 喝水</div>
        </div>
        <a class="m-add" href="#" aria-label="新建任务"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
      </div>
    </header>

    <div class="m-stats">
      <div class="m-stat"><div class="v accent">14:00</div><div class="l">下一次提醒</div></div>
      <div class="m-stat"><div class="v">5</div><div class="l">启用中</div></div>
      <div class="m-stat"><div class="v">12</div><div class="l">今日已提醒</div></div>
    </div>

    <div class="m-chips" id="mChips">
      <button class="m-chip active" data-filter="all">全部</button>
      <button class="m-chip" data-filter="interval">周期</button>
      <button class="m-chip" data-filter="daily">每日</button>
      <button class="m-chip" data-filter="scheduled">定时</button>
      <button class="m-chip" data-filter="disabled">已禁用</button>
    </div>

    <div class="m-scroll" id="mList">

      <article class="m-task" data-type="interval" data-state="enabled">
        <div class="t-top">
          <div class="t-ico ico-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10l-1 5H8L7 2z"/><path d="M8 7c-1 4-2 8-2 10a6 6 0 0 0 12 0c0-2-1-6-2-10"/></svg></div>
          <div class="t-body">
            <div class="t-name">喝水提醒</div>
            <div class="t-desc">起身接杯水，给身体一点缓冲 💧</div>
          </div>
          <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
        </div>
        <div class="t-foot">
          <span class="badge badge-interval">每 20 分钟</span>
          <span class="t-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>距下次 <b data-countdown="752">12:32</b></span>
        </div>
      </article>

      <article class="m-task" data-type="interval" data-state="enabled">
        <div class="t-top">
          <div class="t-ico ico-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 7M12 13l3 7M7 11h10"/></svg></div>
          <div class="t-body">
            <div class="t-name">久坐提醒</div>
            <div class="t-desc">站起来活动 1 分钟，伸展肩颈</div>
          </div>
          <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
        </div>
        <div class="t-foot">
          <span class="badge badge-interval">每 45 分钟</span>
          <span class="t-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>距下次 <b data-countdown="1985">33:05</b></span>
        </div>
      </article>

      <article class="m-task" data-type="daily" data-state="enabled">
        <div class="t-top">
          <div class="t-ico ico-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7z"/><path d="m8.5 8.5 7 7"/></svg></div>
          <div class="t-body">
            <div class="t-name">服药提醒</div>
            <div class="t-desc">饭后服用，记得配温水</div>
          </div>
          <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
        </div>
        <div class="t-foot">
          <span class="badge badge-daily">每日 08:00 · 20:00</span>
          <span class="t-next">今天下一次 <b>20:00</b></span>
        </div>
      </article>

      <article class="m-task" data-type="scheduled" data-state="enabled">
        <div class="t-top">
          <div class="t-ico ico-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg></div>
          <div class="t-body">
            <div class="t-name">项目周会</div>
            <div class="t-desc">同步本周进度与下周排期</div>
          </div>
          <label class="switch"><input type="checkbox" checked /><span class="track"></span></label>
        </div>
        <div class="t-foot">
          <span class="badge badge-scheduled">定时 06-10 09:00</span>
          <span class="t-next">还有 <b>2 天</b></span>
        </div>
      </article>

      <article class="m-task is-disabled" data-type="interval" data-state="disabled">
        <div class="t-top">
          <div class="t-ico ico-gray"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>
          <div class="t-body">
            <div class="t-name">午间护眼远眺</div>
            <div class="t-desc">看向 6 米外物体 20 秒</div>
          </div>
          <label class="switch"><input type="checkbox" /><span class="track"></span></label>
        </div>
        <div class="t-foot">
          <span class="badge badge-paused"><span class="dot" style="background:currentColor;width:6px;height:6px"></span>已禁用</span>
          <span class="t-next">未在计时</span>
        </div>
      </article>

    </div>

    <nav class="m-tabbar">
      <button class="m-tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        任务
      </button>
      <button class="m-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        日程
      </button>
      <button class="m-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        统计
      </button>
      <button class="m-tab" onclick="location.href='mobile-settings.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
    </nav>

    <div class="home-ind"></div>
  </div>
</div>

<script>
  const chips = document.querySelectorAll('#mChips .m-chip');
  const items = document.querySelectorAll('#mList .m-task');
  chips.forEach(c => c.addEventListener('click', () => {
    chips.forEach(x => x.classList.remove('active')); c.classList.add('active');
    const f = c.dataset.filter;
    items.forEach(it => {
      const show = f === 'all' || it.dataset.type === f || it.dataset.state === f;
      it.style.display = show ? '' : 'none';
    });
  }));
  document.querySelectorAll('.m-task .switch input').forEach(inp => {
    inp.addEventListener('change', () => inp.closest('.m-task').classList.toggle('is-disabled', !inp.checked));
  });
  setInterval(() => {
    document.querySelectorAll('[data-countdown]').forEach(el => {
      if (el.closest('.is-disabled')) return;
      let s = Math.max(0, parseInt(el.dataset.countdown, 10) - 1);
      el.dataset.countdown = s;
      el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    });
  }, 1000);
</script>
</body>
</html>
