<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>全屏提醒 · 任务提醒</title>
<link rel="stylesheet" href="css/app.css" />
<style>
  /* 遮罩专属深色 token（置于 :root，符合无裸 hex 约束）*/
  :root {
    --mask-ink: #ffffff;
    --mask-dim: rgba(255,255,255,.62);
    --mask-faint: rgba(255,255,255,.34);
    --mask-veil: rgba(10,11,14,.86);
    --mask-line: rgba(255,255,255,.14);
    --desk-a: #2b2f3a; --desk-b: #14161c;
    --wall-a: #1f3a5f; --wall-b: #142033; --wall-c: #0c0f16;
    --btn-ink: #15171c;
  }
  body { margin: 0; overflow: hidden; }

  /* 背后的桌面（隐约可见）*/
  .desk {
    position: fixed; inset: 0;
    background:
      radial-gradient(900px 500px at 78% 24%, color-mix(in oklab, var(--accent), transparent 70%), transparent),
      linear-gradient(155deg, var(--desk-a), var(--desk-b));
    display: grid; place-items: center;
  }
  .desk .ghost-card {
    width: 420px; height: 250px; border-radius: 16px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
  }

  /* 全屏遮罩 */
  .mask {
    position: fixed; inset: 0; z-index: 5;
    background: var(--mask-veil);
    backdrop-filter: blur(3px);
    color: var(--mask-ink);
    display: grid; place-items: center;
    animation: fadein .35s var(--ease);
  }
  @keyframes fadein { from { opacity: 0; } }
  .mask.bg-wallpaper {
    background:
      linear-gradient(rgba(8,9,12,.74), rgba(8,9,12,.82)),
      radial-gradient(1200px 700px at 30% 20%, var(--wall-a), transparent),
      linear-gradient(160deg, var(--wall-b), var(--wall-c));
  }

  .mask-inner { text-align: center; max-width: 640px; padding: 0 40px; }
  .pill-trigger {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 34px;
    padding: 7px 16px; border-radius: var(--radius-pill);
    background: rgba(255,255,255,.08); border: 1px solid var(--mask-line);
    font-size: 13px; color: var(--mask-dim); letter-spacing: .02em;
  }
  .pill-trigger .dot { width: 7px; height: 7px; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 70%); }
  .mask h1 {
    font-size: clamp(40px, 6vw, 68px); font-weight: 700; line-height: 1.05;
    letter-spacing: -.03em; margin-bottom: 20px;
  }
  .mask .desc { font-size: clamp(18px, 2.2vw, 23px); color: var(--mask-dim); line-height: 1.55; margin-bottom: 30px; max-width: 30ch; margin-inline: auto; }
  .mask .clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 17px; color: var(--mask-faint); letter-spacing: .04em; margin-bottom: 42px; }

  .mask .btn-know {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 40px; border-radius: var(--radius-pill);
    background: var(--mask-ink); color: var(--btn-ink); border: none;
    font-size: 16px; font-weight: 600;
    transition: transform var(--motion-fast) var(--ease), box-shadow var(--motion-fast) var(--ease);
  }
  .mask .btn-know:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .mask .btn-snooze {
    display: inline-flex; align-items: center; gap: 8px; margin-left: 14px;
    padding: 14px 24px; border-radius: var(--radius-pill);
    background: transparent; color: var(--mask-dim); border: 1px solid var(--mask-line);
    font-size: 15px; font-weight: 500;
  }
  .mask .btn-snooze:hover { color: var(--mask-ink); border-color: rgba(255,255,255,.4); }

  /* 倒计时进度条 */
  .countbar-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 26px 48px 30px; }
  .countbar-row { display: flex; align-items: center; gap: 16px; max-width: 1100px; margin-inline: auto; }
  .countbar { flex: 1; height: 6px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
  .countbar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 4px; transition: width 1s linear; }
  .count-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--mask-dim); min-width: 42px; text-align: right; }
  .count-lbl { font-size: 13px; color: var(--mask-faint); }

  /* 演示用小控件 —— 标注为预览控制，不属于产品本体 */
  .demo-note {
    position: fixed; top: 18px; right: 18px; z-index: 7;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.08); border: 1px solid var(--mask-line);
    border-radius: var(--radius-pill); padding: 6px 8px 6px 14px; color: var(--mask-dim); font-size: 12px;
  }
  .demo-note button { background: rgba(255,255,255,.12); color: var(--mask-ink); border: none; border-radius: var(--radius-pill); padding: 5px 12px; font-size: 12px; }
  .demo-note button:hover { background: rgba(255,255,255,.22); }
  .back-link { position: fixed; top: 18px; left: 18px; z-index: 7; color: var(--mask-dim); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .back-link:hover { color: var(--mask-ink); text-decoration: none; }
</style>
</head>
<body>
<div class="desk"><div class="ghost-card"></div></div>

<a class="back-link" href="desktop-tasks.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>返回列表</a>

<div class="demo-note">
  <span>预览控制</span>
  <button id="wallToggle">切换背景壁纸</button>
  <button id="restartBtn">重新触发</button>
</div>

<section class="mask" id="mask" data-od-id="mask">
  <div class="mask-inner">
    <span class="pill-trigger"><span class="dot"></span>周期提醒已触发 · 每 20 分钟</span>
    <h1>喝水提醒</h1>
    <p class="desc">起身接杯水，给眼睛和身体一点缓冲 💧</p>
    <div class="clock" id="clock">2026年6月8日 周一 · 14:00:00</div>
    <div>
      <button class="btn-know" id="knowBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        知道了
      </button>
      <button class="btn-snooze">稍后提醒 · 5 分钟</button>
    </div>
  </div>

  <div class="countbar-wrap" id="countWrap">
    <div class="countbar-row">
      <span class="count-lbl">自动关闭</span>
      <div class="countbar"><i id="bar"></i></div>
      <span class="count-num" id="countNum">30s</span>
    </div>
  </div>
</section>

<script>
  const TOTAL = 30;
  let remain = TOTAL;
  const bar = document.getElementById('bar');
  const countNum = document.getElementById('countNum');
  const clockEl = document.getElementById('clock');
  const mask = document.getElementById('mask');

  function fmt(d) {
    const w = ['日','一','二','三','四','五','六'][d.getDay()];
    const p = n => String(n).padStart(2, '0');
    return `2026年6月8日 周${w} · ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  // 实时时钟（用真实当前时间的时分秒，贴合"当前时间"语义）
  function clock() { clockEl.textContent = fmt(new Date()); }
  clock(); setInterval(clock, 1000);

  let timer;
  function run() {
    clearInterval(timer);
    remain = TOTAL; bar.style.width = '100%'; countNum.textContent = TOTAL + 's';
    timer = setInterval(() => {
      remain--;
      bar.style.width = (remain / TOTAL * 100) + '%';
      countNum.textContent = Math.max(remain, 0) + 's';
      if (remain <= 0) { clearInterval(timer); close(); }
    }, 1000);
  }
  function close() {
    mask.style.transition = 'opacity .35s'; mask.style.opacity = '0';
    setTimeout(() => { mask.style.display = 'none'; }, 360);
  }
  document.getElementById('knowBtn').addEventListener('click', close);
  document.getElementById('restartBtn').addEventListener('click', () => {
    mask.style.display = ''; mask.style.opacity = '1'; run();
  });
  document.getElementById('wallToggle').addEventListener('click', () => {
    mask.classList.toggle('bg-wallpaper');
  });
  run();
</script>
</body>
</html>
